# Deploy da API (LP + agente + scheduler) no Render.
# https://render.com/deploy?repo=https://github.com/IrgoMallis/vigil_summit_agent
services:
  - type: web
    name: vigil-summit-api
    runtime: python
    rootDir: vigil_summit_agent
    plan: free
    buildCommand: pip install -r requirements.txt && cp ../index.html ./index.html
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: LLM_PROVIDER
        value: anthropic
      - key: VIGIL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
